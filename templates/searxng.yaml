use_default_settings: true

server:
  secret_key: "@@SECRET@@"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

# Engine requests go straight to the LB pool (not through mitmproxy, so the
# client's own TLS fingerprint is preserved).
outgoing:
  request_timeout: 10.0
  proxies:
    all://:
      - http://lb:@@LB_PORT@@
