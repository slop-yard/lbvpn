  vpn-@@REGION@@:
    image: qmcgaw/gluetun:latest
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
    volumes:
      - ./configs/wireguard/@@CONF@@:/gluetun/wireguard/wg0.conf:ro
    restart: unless-stopped
