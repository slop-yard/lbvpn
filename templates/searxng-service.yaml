  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "${SEARXNG_PORT:-@@SEARXNG_PORT@@}:8080"
    volumes:
      - ./configs/searxng.yaml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: "http://localhost:${SEARXNG_PORT:-@@SEARXNG_PORT@@}/"
    depends_on: [lb]
    restart: unless-stopped
