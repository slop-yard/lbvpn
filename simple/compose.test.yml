# Same as docker-compose.yml but the VPN container is a stub proxy that
# identifies itself, so you can prove SearXNG is really going through it
# without needing a Proton account.
name: mitmvpn-simple-test

services:
  gluetun:
    build: ../stub
    environment:
      STUB_NAME: PROXY

  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "18080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:18080/
    depends_on: [gluetun]
